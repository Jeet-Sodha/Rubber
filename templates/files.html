<!doctype html>

<html>

<head>

    <title>My File Portal</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }

        .file {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
        }

        .download {
            display: inline-block;
            padding: 8px 14px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .logout {
            display: inline-block;
            margin-top: 20px;
            color: #dc2626;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <h1>My File Portal</h1>

    {% if files %}

        <h2>Files</h2>

        {% for file in files %}

            <div class="file">

                <strong>{{ file.name }}</strong>

                <p>
                    Size:
                    {{ file.size }} bytes
                </p>

                <a
                    class="download"
                    href="/download/{{ file.name }}"
                >
                    Download
                </a>

            </div>

        {% endfor %}

    {% else %}

        <p>No files uploaded yet.</p>

    {% endif %}

    <a
        class="logout"
        href="/logout"
    >
        Logout
    </a>

</body>

</html>
